<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0f1422"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Logo Mark -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Shield / Lead Card Graphic -->
    <rect x="15" y="15" width="270" height="270" rx="60" fill="url(#accent)"/>
    
    <!-- White Minimal Silhouette -->
    <path d="M 80 85 L 220 85 C 230 85 235 90 235 100 L 235 115 C 235 125 230 130 220 130 L 125 130 L 125 145 L 200 145 C 210 145 215 150 215 160 L 215 175 C 215 185 210 190 200 190 L 125 190 L 125 215 L 220 215 C 230 215 235 220 235 230 L 235 245 C 235 255 230 260 220 260 L 80 260 C 70 260 65 255 65 245 L 65 100 C 65 90 70 85 80 85 Z" fill="#ffffff"/>
  </g>
</svg>
